name: CI

on:
  push:
    branches:
      - main
      - v*
    tags:
      - v*
  pull_request:
  workflow_dispatch:

env:
  FORGE: codeberg.org

jobs:
  check:
    runs-on: ["medium", "debian-13-x86_64"]
    steps:
      - name: Check out source code
        uses: https://code.forgejo.org/actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up toolchain
        uses: https://code.forgejo.org/actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.26.10 <1.27.2' # upper limit for staticcheck at 2026-10-09
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y install ca-certificates
          go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: Build service
        run: |
          go build
      - name: Run tests
        run: |
          go test ./...
      - name: Run static analysis
        run: |
          go vet ./...
          staticcheck ./...

  release:
    # IMPORTANT: This workflow step will not work without the Releases unit enabled!
    if: ${{ forge.ref == 'refs/heads/main' || startsWith(forge.event.ref, 'refs/tags/v') }}
    needs: [check]
    runs-on: ["medium", "debian-13-x86_64"]
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y install ca-certificates git curl jq
          # git needs to be installed for build information embedding to work
          # curl and jq are dependencies of actions/forgejo-release
      - name: Check out source code
        uses: https://code.forgejo.org/actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up toolchain
        uses: https://code.forgejo.org/actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.26.10'
      - name: Build release assets
        # If you want more platforms to be represented, send a pull request.
        run: |
          set -x
          build() { GOOS=$1 GOARCH=$2 go build -o assets/git-pages.$1-$2$3; }
          build windows amd64 .exe
          build linux   amd64
          build linux   arm64
          build darwin  arm64
          git archive -o assets/git-pages-src.zip --prefix git-pages/ HEAD
      - name: Create release
        uses: https://code.forgejo.org/actions/forgejo-release@98265452477dafb3f0f27ba9c462c90b18cb44fd # v2.13.4
        with:
          tag: ${{ startsWith(forge.event.ref, 'refs/tags/v') && forge.ref_name || 'latest' }}
          release-dir: assets
          hide-archive-link: true
          direction: upload
          override: true
          prerelease: ${{ !startsWith(forge.event.ref, 'refs/tags/v') }}

  package:
    if: ${{ forge.ref == 'refs/heads/main' || startsWith(forge.event.ref, 'refs/tags/v') }}
    needs: [check]
    runs-on: ["medium", "debian-13-x86_64"]
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y install ca-certificates buildah qemu-user-binfmt
      - name: Check out source code
        uses: https://code.forgejo.org/actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Authenticate with Docker
        run: |
          buildah login --authfile=/tmp/authfile-${FORGE}.json \
            -u ${{ vars.PACKAGES_USER }} -p ${{ secrets.PACKAGES_TOKEN }} ${FORGE}
      - name: Build container
        run: |
          printf '[storage]\ndriver="vfs"\nrunroot="/run/containers/storage"\ngraphroot="/var/lib/containers/storage"\n' | sudo tee /etc/containers/storage.conf
          buildah build ${CACHE} --arch=amd64 --tag=container:${VER}-amd64
          buildah build ${CACHE} --arch=arm64 --tag=container:${VER}-arm64
          buildah manifest create container:${VER} \
            container:${VER}-amd64 \
            container:${VER}-arm64
        env:
          BUILDAH_ISOLATION: chroot
          VER: ${{ startsWith(forge.event.ref, 'refs/tags/v') && forge.ref_name || 'latest' }}
      - if: ${{ forge.repository == 'git-pages/git-pages' }}
        name: Push container to Codeberg
        run: |
          buildah manifest push --authfile=/tmp/authfile-${FORGE}.json \
            --all container:${VER} "docker://${FORGE}/${{ forge.repository }}:${VER/v/}"
        env:
          VER: ${{ startsWith(forge.event.ref, 'refs/tags/v') && forge.ref_name || 'latest' }}

  gomod2nix:
    runs-on: ["medium", "debian-13-x86_64"]
    steps:
      - name: Install Nix
        uses: https://github.com/cachix/install-nix-action@ab739621df7a23f52766f9ccc97f38da6b7af14f # v31
      - name: Check out source code
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.PUSH_TOKEN || forgejo.token }}
      - name: Regenerate gomod2nix
        run: |
          nix develop --command gomod2nix
          nix build
      # Automatic update.
      - if: ${{ forgejo.event_name == 'pull_request' && startsWith(forgejo.head_ref, 'renovate/') }}
        name: Diff gomod2nix (auto-commit)
        run: |
          if ! git diff --color --exit-code; then
            git config set user.name forgejo-actions
            git config set user.email noreply@forgejo.org
            git add -u
            git commit -m "Auto-update gomod2nix."
            git push origin HEAD:${{ forgejo.head_ref }}
          fi
      # Manual update. It's not clear how to make automatic update work in forks.
      - if: ${{ !(forgejo.event_name == 'pull_request' && startsWith(forgejo.head_ref, 'renovate/')) }}
        name: Diff gomod2nix (check)
        run: |
          git diff --color --exit-code
